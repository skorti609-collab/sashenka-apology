<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Для тебя 💜</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Arial,sans-serif;color:white;background:radial-gradient(circle at top,#512477,#100b18 68%)}.card{width:min(100%,650px);padding:40px 27px;text-align:center;background:#1b1425;border:1px solid #8b55b5;border-radius:26px;box-shadow:0 20px 70px #0009}.heart{font-size:55px;animation:pulse 1.5s infinite}h1{font-size:clamp(32px,7vw,48px);color:#e3bdff}p{color:#eee2f5;line-height:1.85;font-size:18px}.choice{padding:18px;border-radius:16px;background:#ffffff0b;margin:22px 0}@keyframes pulse{50%{transform:scale(1.12)}}a{display:inline-block;margin-top:14px;color:#d8a7ff}
</style></head><body><main class="card"><div class="heart">💜</div><h1>Я тебя очень люблю!</h1><p>Сашенька, спасибо, что выбрала провести это время вместе. Ты очень важна для меня. Я хочу дарить тебе заботу, внимание и побольше счастливых моментов.</p><div class="choice"><p>📅 Наша дата: <b>{{ chosen_date }}</b></p><p>✨ Наш план: <b>{{ chosen_place }}</b></p></div><p>Буду очень ждать нашей встречи. ❤️</p><a href="/reset">Начать сначала</a></main></body></html>
