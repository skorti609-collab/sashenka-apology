<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Куда пойдём? 💜</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Arial,sans-serif;color:white;background:radial-gradient(circle at top,#512477,#100b18 68%)}.card{width:min(100%,650px);padding:36px 26px;text-align:center;background:#1b1425;border:1px solid #8b55b5;border-radius:26px;box-shadow:0 20px 70px #0009}.heart{font-size:46px}h1{font-size:clamp(30px,7vw,42px)}p{color:#e6d9ef;line-height:1.7}.option{display:block;margin:14px 0;padding:18px;border:1px solid #75439b;border-radius:16px;background:#ffffff0a;text-align:left;cursor:pointer}.option input{accent-color:#b45cf2;margin-right:10px;transform:scale(1.2)}button{width:100%;padding:16px;margin-top:15px;border:0;border-radius:13px;font-size:17px;font-weight:bold;color:white;background:linear-gradient(90deg,#7e22ce,#b45cf2);cursor:pointer}
</style></head><body><main class="card"><div class="heart">🍣💜🍟</div><h1>А теперь выбери,<br>куда пойдём!</h1><p>Дата нашей встречи: <b>{{ chosen_date }}</b></p><p>Мне будет приятно провести это время вместе. Выбирай, что тебе больше нравится:</p><form method="post"><label class="option"><input type="radio" name="place" value="kfc" required> 🍗 KFC</label><label class="option"><input type="radio" name="place" value="mcdonalds"> 🍔 McDonald's</label><label class="option"><input type="radio" name="place" value="sushi"> 🍣 Закажем суши домой</label><button type="submit">Это мой выбор 💜</button></form></main></body></html>
